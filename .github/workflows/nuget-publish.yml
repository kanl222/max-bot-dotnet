name: Build, Publish

on:
  push:
    branches:
      - main
  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  PROJECT_PATH: 'MAX.Bot/MAX.Bot.csproj'

jobs:
  # =================== ШАГ 1: СБОРКА И СОЗДАНИЕ ПАКЕТА ===================
  build-and-pack:
    name: Build and Create NuGet Package
    runs-on: ubuntu-latest
    
    outputs:
      package_version: ${{ steps.set_version.outputs.package_version }}
      package_name: ${{ steps.build.outputs.package_name }}
      package_file: ${{ steps.build.outputs.package_file }}
    
    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Get package version
      id: get_version
      run: |
        PACKAGE_VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' ${{ env.PROJECT_PATH }})
        echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

    - name: Build project
      id: build
      run: |
        dotnet build ${{ env.PROJECT_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }}
        PACKAGE_NAME=$(basename -s .csproj ${{ env.PROJECT_PATH }})
        echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
        echo "package_file=${{ github.workspace }}/Examples/Releases/$PACKAGE_NAME.${{ steps.get_version.outputs.package_version }}.nupkg" >> $GITHUB_OUTPUT
    
    - name: Upload build artifacts
      id: upload_artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ${{ github.workspace }}/Examples/Releases/*.nupkg
        retention-days: 7

  # =================== ШАГ 2: ПУБЛИКАЦИЯ В NUGET.ORG ===================
  publish-to-nuget:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: build-and-pack
    permissions:
      contents: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish to NuGet.org
      env:
        NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        echo "Publishing packages to NuGet.org..."
        
        # Находим основной пакет (без symbols)
        PACKAGE_FILE=$(ls *.nupkg | grep -v symbols | head -1)
        
        if [ -z "$PACKAGE_FILE" ]; then
          echo "ERROR: No package file found!"
          exit 1
        fi
        
        echo "Publishing: $PACKAGE_FILE"
        echo "Version: ${{ needs.build-and-pack.outputs.package_version || steps.get_version.outputs.package_version }}"
        
        # Публикуем пакет
        dotnet nuget push "$PACKAGE_FILE" \
          --source "https://api.nuget.org/v3/index.json" \
          --api-key "$NUGET_KEY" \
          --timeout 300
        
        if [ $? -eq 0 ]; then
          echo "✅ Successfully published to NuGet.org"
          echo "📦 Package URL: https://www.nuget.org/packages/${{ needs.build-and-pack.outputs.package_name || 'SaaSoft.MAX.Bot' }}/"
          
          # Создаем релиз в GitHub
          echo "Creating GitHub Release..."
        else
          echo "❌ Failed to publish to NuGet.org"
          exit 1
        fi
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        name: Release ${{ needs.build-and-pack.outputs.package_version || steps.get_version.outputs.package_version }}
        tag_name: v${{ needs.build-and-pack.outputs.package_version || steps.get_version.outputs.package_version }}
        generate_release_notes: true
        files: |
          *.nupkg